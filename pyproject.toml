[project]
name = "maybemap"
version = "0.2.0"
description = "Builds one interactive HTML map of service zones, towns and dispatch drive times"
requires-python = ">=3.14"
dependencies = [
    "pandas>=1.3.0",
    "geopandas>=0.10.0",
    "requests>=2.28.0",
    "osmnx>=1.2.0",
    "shapely>=1.8.0",
    "python-dotenv>=0.19.0",
    "openpyxl>=3.0.9",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "black>=24.0",
]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
